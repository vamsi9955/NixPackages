name: Build and Cache Packages

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        # List all packages exposed in your flake.nix
        package: 
          - grimmory
          - bytestash
          # - bookorbit
          - decky-loader
          - it-tools
          - networking-toolbox
          - omni-tools
          - mazanoke
          - yamtrack
          - yamtrack-git
          - ab-download-manager
      fail-fast: false # If one package fails, keep building the others!
    
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          swap-storage: false
        
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@v14
        with:
          name: vamsi9955
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build Package
        run: nix build .#${{ matrix.package }} --print-build-logs
