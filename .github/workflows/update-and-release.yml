name: Auto-Update and Release Packages

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check Updates and Create Consolidated Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Upstream repositories for packages that publish tagged releases
          declare -A UPSTREAM_REPOS=(
            ["grimmory"]="grimmory-tools/grimmory"
            ["bytestash"]="jordan-dalby/ByteStash"
            ["decky-loader"]="SteamDeckHomebrew/decky-loader"
            ["bibata-hyprcursor"]="ful1e5/Bibata_Cursor"
          )

          UPDATED_COUNT=0
          SUMMARY_TEXT="## 📦 Packages Updated\n\n"
          CHANGELOG_TEXT=""

          for pkg in "${!UPSTREAM_REPOS[@]}"; do
            upstream="${UPSTREAM_REPOS[$pkg]}"
            echo "🔄 Checking for updates: $pkg"

            old_version=$(nix eval --raw .#packages.x86_64-linux.$pkg.version 2>/dev/null || echo "unknown")

            # Let nix-update update hashes and commit if a newer release exists
            nix-shell -p nix-update --run "nix-update --flake $pkg --commit || true"

            new_version=$(nix eval --raw .#packages.x86_64-linux.$pkg.version 2>/dev/null || echo "unknown")

            if [ "$old_version" != "$new_version" ] && [ "$new_version" != "unknown" ]; then
              echo "✅ $pkg updated: $old_version -> $new_version"
              UPDATED_COUNT=$((UPDATED_COUNT + 1))

              SUMMARY_TEXT+="- **$pkg**: \`$old_version\` ➡️ \`$new_version\`\n"

              echo "Fetching upstream changelog from $upstream..."
              RELEASE_JSON=$(gh api "repos/$upstream/releases/latest" 2>/dev/null || echo "")
              BODY=$(echo "$RELEASE_JSON" | jq -r '.body // "No upstream release notes provided."')

              CHANGELOG_TEXT+="\n---\n\n### 🚀 $pkg $new_version Changelog ([Upstream](https://github.com/$upstream/releases/latest))\n\n$BODY\n"
            else
              echo "⚡ $pkg is already up-to-date."
            fi
          done

          if [ $UPDATED_COUNT -gt 0 ]; then
            echo "Pushing update commits to main..."
            git push origin HEAD:main

            # Determine incremental tag (v1, v2, v3...)
            LATEST_TAG=$(gh release list -L 1 | awk '{print $1}' | grep -E '^v[0-9]+$' || echo "v0")
            NUM=${LATEST_TAG#v}
            NEXT_TAG="v$((NUM + 1))"

            NOTES_FILE="/tmp/release_notes.md"
            echo -e "$SUMMARY_TEXT" > "$NOTES_FILE"
            echo -e "$CHANGELOG_TEXT" >> "$NOTES_FILE"

            echo "Creating GitHub Release $NEXT_TAG..."
            gh release create "$NEXT_TAG" \
              --title "Release $NEXT_TAG" \
              --notes-file "$NOTES_FILE"

            echo "🎉 Release $NEXT_TAG created successfully!"
          else
            echo "All packages are up to date."
          fi
