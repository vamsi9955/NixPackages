name: Auto-Update and Release Packages

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Process Updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPDATED_COUNT=0
          SUMMARY_TEXT="## 📦 Packages Updated\n\n"
          CHANGELOG_TEXT=""

          # ====================================================================
          # 1. TAGGED SOURCE REPOS (Handled by nix-update)
          # ====================================================================
          declare -A TAGGED_REPOS=(
            ["decky-loader"]="SteamDeckHomebrew/decky-loader"
            ["bytestash"]="jordan-dalby/ByteStash"
          )

          for pkg in "${!TAGGED_REPOS[@]}"; do
            upstream="${TAGGED_REPOS[$pkg]}"
            echo "🔄 Checking Tagged Repo: $pkg"

            old_version=$(nix eval --raw .#packages.x86_64-linux.$pkg.version 2>/dev/null || echo "unknown")
            nix-shell -p nix-update --run "nix-update --flake $pkg --commit || true"
            new_version=$(nix eval --raw .#packages.x86_64-linux.$pkg.version 2>/dev/null || echo "unknown")

            if [ "$old_version" != "$new_version" ] && [ "$new_version" != "unknown" ]; then
              echo "✅ $pkg updated: $old_version -> $new_version"
              UPDATED_COUNT=$((UPDATED_COUNT + 1))
              SUMMARY_TEXT+="- **$pkg**: \`$old_version\` ➡️ \`$new_version\`\n"
              RELEASE_JSON=$(gh api "repos/$upstream/releases/latest" 2>/dev/null || echo "")
              BODY=$(echo "$RELEASE_JSON" | jq -r '.body // "No upstream release notes provided."')
              CHANGELOG_TEXT+="\n---\n\n### 🚀 $pkg $new_version ([Upstream](https://github.com/$upstream/releases/latest))\n\n$BODY\n"
            fi
          done

          # ====================================================================
          # 2. ROLLING REPOS (Tracks main branch via nix-update)
          # ====================================================================
          declare -A ROLLING_REPOS=(
            ["it-tools"]="CorentinTh/it-tools"
            ["mazanoke"]="civilblur/mazanoke"
            ["networking-toolbox"]="lissy93/networking-toolbox"
            ["omni-tools"]="iib0011/omni-tools"
          )

          for pkg in "${!ROLLING_REPOS[@]}"; do
            echo "🔄 Checking Rolling Repo: $pkg"
            old_version=$(nix eval --raw .#packages.x86_64-linux.$pkg.version 2>/dev/null || echo "unknown")
            nix-shell -p nix-update --run "nix-update --flake --version branch=main $pkg --commit || true"
            new_version=$(nix eval --raw .#packages.x86_64-linux.$pkg.version 2>/dev/null || echo "unknown")

            if [ "$old_version" != "$new_version" ] && [ "$new_version" != "unknown" ]; then
              echo "✅ $pkg updated: $old_version -> $new_version"
              UPDATED_COUNT=$((UPDATED_COUNT + 1))
              SUMMARY_TEXT+="- **$pkg**: \`$old_version\` ➡️ \`$new_version\` (Rolling)\n"
              CHANGELOG_TEXT+="\n---\n\n### 🚀 $pkg $new_version\n\nUpdated to the latest commit on the main branch.\n"
            fi
          done

          # ====================================================================
          # 3. BINARY REPOS (Dynamic Asset Fetching to prevent 404 errors)
          # FORMAT: ["pkg-name"]="owner/repo|asset_regex"
          # ====================================================================
          declare -A BINARY_REPOS=(
            ["grimmory"]="grimmory-tools/grimmory|.jar$"
            ["ab-download-manager"]="amir1376/ab-download-manager|linux_x64\.tar\.gz$"
          )

          for pkg in "${!BINARY_REPOS[@]}"; do
             IFS='|' read -r upstream ext <<< "${BINARY_REPOS[$pkg]}"
             echo "🔄 Checking Binary Repo: $pkg"

             old_version=$(nix eval --raw .#packages.x86_64-linux.$pkg.version 2>/dev/null || echo "unknown")
             RELEASE_JSON=$(gh api "repos/$upstream/releases/latest" 2>/dev/null || echo "")
             new_version=$(echo "$RELEASE_JSON" | jq -r '.tag_name // empty' | sed 's/^v//')

             if [ "$old_version" != "$new_version" ] && [ -n "$new_version" ]; then
                echo "✅ $pkg update found: $old_version -> $new_version"
                
                # Dynamically locate the download URL based on the file extension
                DOWNLOAD_URL=$(echo "$RELEASE_JSON" | jq -r --arg ext "$ext" '.assets[] | select(.name | test($ext)) | .browser_download_url' | head -n 1)
                
                if [ -n "$DOWNLOAD_URL" ] && [ "$DOWNLOAD_URL" != "null" ]; then
                   echo "Downloading $DOWNLOAD_URL to calculate SRI Hash..."
                   # Let Nix calculate the exact SRI hash directly from the URL
                   new_hash=$(nix store prefetch-file --json "$DOWNLOAD_URL" | jq -r '.hash')
                   
                   pkg_file="pkgs/$pkg/package.nix"
                   # Safely inject the new version, URL, and hash
                   sed -i "s/version = \".*\";/version = \"$new_version\";/" "$pkg_file"
                   sed -i "s|url = \".*\";|url = \"$DOWNLOAD_URL\";|" "$pkg_file"
                   sed -i "s|hash = \".*\";|hash = \"$new_hash\";|" "$pkg_file"

                   git add "$pkg_file"
                   git commit -m "$pkg: $old_version -> $new_version"

                   UPDATED_COUNT=$((UPDATED_COUNT + 1))
                   SUMMARY_TEXT+="- **$pkg**: \`$old_version\` ➡️ \`$new_version\` (Binary)\n"
                   BODY=$(echo "$RELEASE_JSON" | jq -r '.body // "No release notes provided."')
                   CHANGELOG_TEXT+="\n---\n\n### 🚀 $pkg $new_version ([Upstream](https://github.com/$upstream/releases/latest))\n\n$BODY\n"
                else
                   echo "⚠️ Could not find an asset matching '$ext' for $pkg in release $new_version"
                fi
             else
                echo "⚡ $pkg is already up-to-date."
             fi
          done

          # ====================================================================
          # 4. PUBLISH RELEASE
          # ====================================================================
          if [ $UPDATED_COUNT -gt 0 ]; then
            git push origin HEAD:main
            
            # Safely grab the highest v-tag (e.g., v1)
            LATEST_TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "v0")
            NEXT_TAG="v$((${LATEST_TAG#v} + 1))"

            NOTES_FILE="/tmp/release_notes.md"
            echo -e "$SUMMARY_TEXT\n$CHANGELOG_TEXT" > "$NOTES_FILE"

            gh release create "$NEXT_TAG" --title "Release $NEXT_TAG" --notes-file "$NOTES_FILE"
            echo "🎉 Release $NEXT_TAG created successfully!"
          else
            echo "All packages are up to date."
          fi
